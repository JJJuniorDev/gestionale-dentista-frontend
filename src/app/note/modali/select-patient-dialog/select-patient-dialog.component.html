<div class="modal-overlay">
  <div class="modal-container">
    <h2 class="modal-title"> Seleziona un Paziente</h2>

    <!-- Campo di ricerca -->
    <div class="search-container">
      <input type="text" [formControl]="searchControl" placeholder="🔍 Cerca per nome o codice fiscale..." class="search-box" />
    </div>

    <!-- Lista pazienti -->
    <div class="patient-list">
      <div *ngFor="let patient of filteredPatients" 
           class="patient-card" 
           [class.selected]="patient === selectedPatient"
           (click)="selectPatient(patient)">
        <div class="patient-info">
          <h4> {{ patient.nome }}</h4>
          <p><strong>CF:</strong> {{ patient.codiceFiscale }}</p>
        </div>
        <div class="select-icon" *ngIf="patient === selectedPatient">✔️</div>
      </div>
    </div>

    <!-- Paginazione -->
    <div class="pagination">
      <button (click)="changePage(-1)" [disabled]="page === 0">⬅️</button>
      <span> Pagina {{ page + 1 }} </span>
      <button (click)="changePage(1)" [disabled]="(page + 1) * pageSize >= patients.length">➡️</button>
    </div>

    <!-- Azioni -->
    <div class="actions">
      <button (click)="close()">❌ Annulla</button>
      <button (click)="confirmSelection()" [disabled]="!selectedPatient">✔️ Conferma</button>
    </div>
  </div>
</div>
