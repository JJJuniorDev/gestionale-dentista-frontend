<mat-card class="event-card">
  <mat-card-title class="title">  📅 {{ editMode ? 'Modifica Evento' : 'Creazione Evento' }}</mat-card-title>
  <mat-card-content>
    <form [formGroup]="formEvento" (ngSubmit)="onSubmit()" class="event-form">
      
      <!-- Selezione del campo di ricerca -->
      <ng-container *ngIf="!editMode">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Seleziona campo di ricerca</mat-label>
          <mat-select [(value)]="searchField">
            <mat-option value="cf">Codice Fiscale</mat-option>
            <mat-option value="nome">Nome</mat-option>
            <mat-option value="cognome">Cognome</mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Selezione Paziente -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Seleziona Paziente</mat-label>
          <input
            type="text"
            matInput
            [formControl]="pazienteFilterCtrl"
            [matAutocomplete]="auto"
            placeholder="Cerca per codice fiscale o nome"
          />
          <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onPazienteSelect($event)">
            <mat-option *ngFor="let paziente of filteredPazienti | async" [value]="paziente.codiceFiscale">
              {{ paziente.codiceFiscale }} - {{ paziente.nome }} {{ paziente.cognome }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </ng-container>

      <!-- Data -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Data</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="dataEvento">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <!-- Orario -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Orario</mat-label>
        <mat-select formControlName="orario">
          <mat-option *ngFor="let ora of orariDisponibili" [value]="ora">
            {{ ora }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Tipologia -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Tipologia</mat-label>
        <input matInput formControlName="tipologia" placeholder="Es. Follow-up Psichiatrico">
      </mat-form-field>

      <!-- Descrizione -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descrizione</mat-label>
        <textarea matInput formControlName="descrizione" rows="3" placeholder="Inserisci descrizione"></textarea>
      </mat-form-field>

      <!-- Pulsanti -->
      <div class="button-group">
        <button mat-raised-button color="primary" type="submit" [disabled]="!formEvento.valid">
          <mat-icon>check_circle</mat-icon> Salva
        </button>
        <button mat-stroked-button color="warn" type="button" (click)="onCancel()">
          <mat-icon>close</mat-icon> Annulla
        </button>
      </div>

    </form>
  </mat-card-content>
</mat-card>
