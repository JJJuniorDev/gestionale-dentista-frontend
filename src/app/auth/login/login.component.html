<div class="container">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="submitForm()">
        <div class="form-group">
            <label for="email">Email</label>
            <input 
                type="email" 
                class="form-control" 
                id="email" 
                formControlName="email" 
                required 
                email 
                placeholder="Inserisci la tua email"
            />
            <div *ngIf="loginForm.controls['email'].invalid && loginForm.controls['email'].touched" class="text-danger">
                Per favore inserisci un'email valida.
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                class="form-control" 
                id="password" 
                formControlName="password" 
                required 
                minlength="6" 
                placeholder="Inserisci la tua password"
            />
            <div *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched" class="text-danger">
                La password deve contenere almeno 6 caratteri.
            </div>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Login</button>
    </form>

    <div class="mt-3">
        <p>Non hai un account? <button class="btn btn-link" (click)="navigateToRegister()">Registrati</button></p>
    </div>
</div>
